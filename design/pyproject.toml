[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-design"
version = "1.0.0"
description = "Unified design lifecycle and implementation memory MCP server"
requires-python = ">=3.11"
dependencies = ["mcp==2.0.0", "pydantic==2.13.4", "pyyaml==6.0.3"]

[project.scripts]
mcp-design = "mcp_server_design.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_design"]
